<div class="modal-panel cw-claude-code-modal" role="dialog" aria-modal="true" aria-labelledby="{{ node_id }}BlockModalTitle" data-generic-block-modal-root data-claude-code-modal-root data-block-runtime-refresh="autonomous" data-node-id="{{ node_id }}" data-node-kind="{{ node_kind }}">
  <div class="modal-header">
    <div>
      <span class="panel-kicker">Bloc {{ node_kind_title }}</span>
      <h2 id="{{ node_id }}BlockModalTitle">{{ node_title }}</h2>
    </div>
    <div class="modal-actions">
      <button class="ghost-btn" data-close-block-modal type="button">Close</button>
    </div>
  </div>
  {{ modal_tabs_html }}
  <div class="claude-modal-footer">
    <span class="field-hint">The runtime runs Claude Code with <code>-p</code>.</span>
    <div class="modal-actions">
      <button class="ghost-btn" data-close-block-modal type="button">Cancel</button>
      <button class="solid-btn" data-block-apply type="button" disabled>Apply</button>
    </div>
  </div>
</div>
